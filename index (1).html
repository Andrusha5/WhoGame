<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Угадай Кто? — Online Game</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Firebase для уникальной регистрации и бесперебойной сети без server-error -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #161b26 0%, #080b11 100%);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gold: #ffb703;
      --accent-red: #ff3366;
      --accent-green: #00f59b;
      --glass-bg: rgba(20, 27, 45, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-glow: rgba(0, 242, 254, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Rubik', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold), var(--accent-red));
      z-index: 100;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      padding: 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--glass-glow);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo-title {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-cyan) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .logo-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: block;
    }

    .custom-input, .custom-select {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    .custom-input:focus, .custom-select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      color: #041226;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.35);
    }

    .btn-gold {
      background: linear-gradient(135deg, #ff9f1c, var(--accent-gold));
      color: #1e1300;
      box-shadow: 0 8px 25px rgba(255, 183, 3, 0.35);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--glass-border);
      color: var(--text-main);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 14px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: var(--accent-cyan);
      color: #041226;
    }

    /* ИГРОВОЕ ПОЛЕ 5x5 */
    .game-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 12px 18px;
      margin-bottom: 12px;
    }

    .score-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-gold);
    }

    .timer-ring {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 700px;
      aspect-ratio: 1 / 1;
      margin-bottom: 14px;
    }

    .card-item {
      position: relative;
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 75%;
      object-fit: cover;
      border-radius: 8px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
    }

    .card-item.selected {
      border-color: var(--accent-gold);
      box-shadow: 0 0 16px rgba(255, 183, 3, 0.4);
    }

    .card-item.closed {
      opacity: 0.2;
      filter: grayscale(100%);
      pointer-events: none;
    }

    .card-item.closed::after {
      content: '✖';
      position: absolute;
      font-size: 32px;
      color: var(--accent-red);
    }

    .action-panel {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 700px;
    }
  </style>
</head>
<body>

  <!-- ==================== ЭКРАН 1: АВТОРИЗАЦИЯ ==================== -->
  <section id="authScreen" class="screen active">
    <div class="glass-card">
      <h1 class="logo-title">Угадай Кто?</h1>
      <p class="logo-subtitle">Регистрация и Вход</p>

      <div class="auth-tabs">
        <div id="tabLogin" class="auth-tab active" onclick="setAuthMode('login')">Вход</div>
        <div id="tabRegister" class="auth-tab" onclick="setAuthMode('register')">Регистрация</div>
      </div>

      <div class="input-group">
        <label class="input-label">Твой Никнейм</label>
        <input type="text" id="authNick" class="custom-input" placeholder="Введите уникальный ник" maxlength="15">
      </div>

      <div class="input-group">
        <label class="input-label">Пароль</label>
        <input type="password" id="authPass" class="custom-input" placeholder="Пароль">
      </div>

      <button id="authSubmitBtn" class="btn btn-primary" onclick="handleAuthSubmit()">
        Войти
      </button>

      <p id="authError" style="font-size: 13px; color: var(--accent-red); margin-top: 14px; display: none;"></p>
    </div>
  </section>

  <!-- ==================== ЭКРАН 2: ЛОББИ ==================== -->
  <section id="lobbyScreen" class="screen">
    <div class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span id="userBadge" style="font-weight: 700; color: var(--accent-cyan);">Привет, Игрок!</span>
        <button onclick="logout()" style="background: none; border: none; color: var(--accent-red); font-size: 12px; cursor: pointer; font-weight: 700;">Выйти</button>
      </div>

      <h1 class="logo-title" style="font-size: 26px;">Выбор комнаты</h1>

      <button class="btn btn-gold" onclick="createRoom()" style="margin-bottom: 16px;">
        ✨ Создать комнату
      </button>

      <div class="input-group">
        <label class="input-label">Код комнаты друга (4 цифры)</label>
        <input type="number" id="joinCodeInput" class="custom-input" placeholder="Например: 1234" style="text-align: center; font-size: 20px;">
      </div>

      <button class="btn btn-outline" onclick="joinRoom()">
        🔗 Подключиться по коду
      </button>

      <p id="lobbyStatus" style="font-size: 13px; color: var(--accent-cyan); margin-top: 12px; display: none;"></p>
    </div>
  </section>

  <!-- ==================== ЭКРАН 3: ОЖИДАНИЕ В КОМНАТЕ ==================== -->
  <section id="roomScreen" class="screen">
    <div class="glass-card">
      <span style="font-size: 12px; color: var(--text-muted); font-weight: 700;">КОД КОМНАТЫ</span>
      <h2 id="roomCodeDisplay" style="font-family: 'Outfit'; font-size: 48px; color: var(--accent-gold); letter-spacing: 6px;">----</h2>

      <div class="input-group">
        <label class="input-label">Выбор из 10 паков</label>
        <select id="packSelect" class="custom-select" onchange="onPackChanged()">
          <option value="cars">🚗 Марки Автомобилей</option>
          <option value="celebrities">🌟 Знаменитости</option>
          <option value="bloggers">🎥 Блогеры</option>
          <option value="ufc">🥊 Бойцы UFC</option>
          <option value="flags">🌍 Флаги стран</option>
          <option value="food">🍕 Блюда мира</option>
          <option value="neutral">📦 Нейтральная</option>
          <option value="animals">🦁 Животные</option>
          <option value="fruits">🍎 Фрукты</option>
          <option value="brands">🏷️ Известные Бренды</option>
        </select>
      </div>

      <div id="waitingBadge" style="background: rgba(0, 242, 254, 0.1); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 13px;">
        ⏳ Ожидаем соперника... (1/2)
      </div>

      <button id="startGameBtn" class="btn btn-primary" onclick="startGame()" disabled>
        🚀 Начать игру
      </button>
    </div>
  </section>

  <!-- ==================== ЭКРАН 4: ИГРА ==================== -->
  <section id="gameScreen" class="screen">
    <div class="game-header">
      <div class="score-badge" id="scoreDisplay">0 : 0</div>
      <div style="text-align: center;">
        <span style="font-size: 11px; color: var(--text-muted); font-weight: 700;" id="phaseTitle">Фаза выбора</span>
        <div style="font-size: 14px; font-weight: 800; color: var(--accent-cyan);" id="turnStatus">ВЫБЕРИ КАРТУ</div>
      </div>
      <div class="timer-ring" id="timerDisplay">30</div>
    </div>

    <div class="board-grid" id="boardGrid"></div>

    <div class="action-panel">
      <button id="confirmBtn" class="btn btn-primary" onclick="confirmTurn()" disabled>❌ Закрыть карты</button>
      <button id="guessBtn" class="btn btn-gold" onclick="makeGuess()" disabled>🎯 Досрочно</button>
    </div>
  </section>

  <script>
    /* ========================================================
       1. КОНФИГУРАЦИЯ БАЗЫ ДАННЫХ FIREBASE (БЕСПЛАТНО И СТАБИЛЬНО)
    ======================================================== */
    const firebaseConfig = {
      databaseURL: "https://guesswho-game-default-rtdb.europe-west1.firebasedatabase.app"
    };
    
    // Инициализация общего бесплатного сервера
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    /* ========================================================
       2. СПИСОК 10 ПАКОВ С АВТО-ЗАГРУЗКОЙ КАРТИНОК ИЗ ПАПКИ Packs/
    ======================================================== */
    const PACK_NAMES = {
      cars: "Машины", celebrities: "Знаменитости", bloggers: "Блогеры",
      ufc: "Бойцы", flags: "Флаги", food: "Блюда",
      neutral: "Нейтральная", animals: "Животные", fruits: "Фрукты", brands: "Бренды"
    };

    let currentUser = null;
    let currentRoomCode = null;
    let isHost = false;
    let authMode = 'login';
    let currentPack = 'cars';
    let mySecretIdx = -1;
    let isMyTurn = false;
    let timerValue = 30;
    let timerTimer = null;
    let cardStates = [];

    /* ========================================================
       3. АВТО-ВХОД И РЕГИСТРАЦИЯ С ПАРОЛЕМ
    ======================================================== */
    window.onload = function() {
      const savedUser = localStorage.getItem('guessWhoUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showLobby();
      }
    };

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    }

    function handleAuthSubmit() {
      const nick = document.getElementById('authNick').value.trim();
      const pass = document.getElementById('authPass').value.trim();
      const errEl = document.getElementById('authError');

      if (!nick || !pass) {
        showError('Заполните все поля!');
        return;
      }

      const userRef = db.ref('users/' + nick.toLowerCase());

      userRef.once('value').then(snapshot => {
        const data = snapshot.val();

        if (authMode === 'register') {
          if (data) {
            showError('Этот никнейм уже занят! Выберите другой.');
          } else {
            userRef.set({ pass: pass }).then(() => {
              currentUser = { nick: nick };
              localStorage.setItem('guessWhoUser', JSON.stringify(currentUser));
              showLobby();
            });
          }
        } else {
          if (!data) {
            showError('Пользователь не найден! Нажмите Регистрация.');
          } else if (data.pass !== pass) {
            showError('Неверный пароль!');
          } else {
            currentUser = { nick: nick };
            localStorage.setItem('guessWhoUser', JSON.stringify(currentUser));
            showLobby();
          }
        }
      });
    }

    function showError(msg) {
      const errEl = document.getElementById('authError');
      errEl.innerText = msg;
      errEl.style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('guessWhoUser');
      currentUser = null;
      switchScreen('authScreen');
    }

    function showLobby() {
      document.getElementById('userBadge').innerText = "👤 " + currentUser.nick;
      switchScreen('lobbyScreen');
    }

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    /* ========================================================
       4. ОНЛАЙН СЕТЬ И КОМНАТЫ
    ======================================================== */
    function createRoom() {
      isHost = true;
      currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
      
      const roomRef = db.ref('rooms/' + currentRoomCode);
      roomRef.set({
        host: currentUser.nick,
        guest: null,
        pack: 'cars',
        state: 'waiting'
      });

      document.getElementById('roomCodeDisplay').innerText = currentRoomCode;
      document.getElementById('packSelect').disabled = false;
      switchScreen('roomScreen');

      // Слушаем подключение второго игрока
      roomRef.on('value', snapshot => {
        const val = snapshot.val();
        if (val && val.guest) {
          document.getElementById('waitingBadge').innerText = "✅ Подключился: " + val.guest;
          document.getElementById('startGameBtn').disabled = false;
        }
        if (val && val.state === 'playing') {
          startMatch(val.pack);
        }
      });
    }

    function joinRoom() {
      const code = document.getElementById('joinCodeInput').value.trim();
      if (!code) return;

      const roomRef = db.ref('rooms/' + code);
      roomRef.once('value').then(snapshot => {
        if (!snapshot.exists()) {
          alert('Комната не найдена!');
          return;
        }
        isHost = false;
        currentRoomCode = code;

        roomRef.update({ guest: currentUser.nick });
        document.getElementById('roomCodeDisplay').innerText = code;
        document.getElementById('packSelect').disabled = true;
        document.getElementById('waitingBadge').innerText = "Ожидаем старт от создателя...";
        switchScreen('roomScreen');

        roomRef.on('value', snap => {
          const val = snap.val();
          if (val && val.state === 'playing') {
            startMatch(val.pack);
          }
        });
      });
    }

    function onPackChanged() {
      if (!isHost) return;
      currentPack = document.getElementById('packSelect').value;
      db.ref('rooms/' + currentRoomCode).update({ pack: currentPack });
    }

    function startGame() {
      if (!isHost) return;
      db.ref('rooms/' + currentRoomCode).update({ state: 'playing' });
    }

    /* ========================================================
       5. ИГРОВОЙ ПРОЦЕСС И ГЕНЕРАЦИЯ 25 КАРТОЧЕК
    ======================================================== */
    function startMatch(packKey) {
      currentPack = packKey;
      switchScreen('gameScreen');

      const grid = document.getElementById('boardGrid');
      grid.innerHTML = '';
      cardStates = [];

      for (let i = 1; i <= 25; i++) {
        cardStates.push({ closed: false, selected: false });

        const card = document.createElement('div');
        card.className = 'card-item';
        card.id = `card-${i}`;
        card.onclick = () => onCardClick(i);

        // Путь к картинке из папки Packs/packKey/i.jpg
        const imgPath = `Packs/${packKey}/${i}.jpg`;

        card.innerHTML = `
          <img src="${imgPath}" class="card-img" onerror="this.src='https://via.placeholder.com/150/1e293b/00f2fe?text=${i}'">
          <div class="card-label">#${i}</div>
        `;
        grid.appendChild(card);
      }
    }

    function onCardClick(idx) {
      cardStates[idx - 1].selected = !cardStates[idx - 1].selected;
      document.getElementById(`card-${idx}`).classList.toggle('selected', cardStates[idx - 1].selected);

      const count = cardStates.filter(c => c.selected).length;
      document.getElementById('confirmBtn').disabled = count === 0;
      document.getElementById('guessBtn').disabled = count !== 1;
    }

    function confirmTurn() {
      cardStates.forEach((st, i) => {
        if (st.selected) {
          st.closed = true;
          st.selected = false;
          const el = document.getElementById(`card-${i + 1}`);
          el.classList.remove('selected');
          el.classList.add('closed');
        }
      });
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('guessBtn').disabled = true;
    }

    function makeGuess() {
      alert('Проверка ответа! Отправляем хост-серверу...');
    }
  </script>
</body>
</html>
